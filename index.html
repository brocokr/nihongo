<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="description" content="broco Nihongo · 한자를 처음부터 함께 배우는 레벨형 일본어 학습 앱">

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%2228%22%20y%3D%2234%22%20width%3D%228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%235d8a3a%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2228%22%20r%3D%2213%22%20fill%3D%22%232e7d32%22/%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2228%22%20r%3D%2213%22%20fill%3D%22%232e7d32%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2218%22%20r%3D%2214%22%20fill%3D%22%2343a047%22/%3E%3C/svg%3E">
<title>broco Nihongo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column. Home = level picker + furigana rule + chapter list; Chapter = back bar + one study view */
:root{
  --bg:#eef4ec; --surface:#ffffff; --ink:#1b2a1e; --muted:#5a6d5e; --line:#d2e0d0;
  --accent:#2e7d32; --accent-soft:#dcefd8; --good:#11796b; --good-soft:#d5f0ea; --bad:#b2414f; --bad-soft:#f8e1e4;
  --plum:#7a3e8e; --plum-soft:#f1e3f6; --top:#a3324a; --top-soft:#f7e0e5; --guide:#c8dcc4; --sun:#9a5b00; --sun-soft:#fbedd2;
  --r-iron:#666c73; --r-bronze:#9c5a2b; --r-silver:#76838f; --r-gold:#a87a05; --r-plat:#17877e; --r-diamond:#2f68d0; --r-master:#8d36b8; --r-chall:#b4233f;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1611; --surface:#17231a; --ink:#e5efe6; --muted:#95a999; --line:#29392d;
  --accent:#7ed389; --accent-soft:#1d3a23; --good:#5fd0bc; --good-soft:#12342e; --bad:#ff8f9c; --bad-soft:#43202a;
  --plum:#d9a6ec; --plum-soft:#3a2347; --top:#ff9db0; --top-soft:#45202a; --guide:#324638; --sun:#e8b45c; --sun-soft:#3b2d15;
  --r-iron:#a6acb3; --r-bronze:#dc9a64; --r-silver:#c6cfd7; --r-gold:#f1c64e; --r-plat:#5fd3c6; --r-diamond:#86b4ff; --r-master:#d9a2ff; --r-chall:#ff8fa3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1611; --surface:#17231a; --ink:#e5efe6; --muted:#95a999; --line:#29392d;
  --accent:#7ed389; --accent-soft:#1d3a23; --good:#5fd0bc; --good-soft:#12342e; --bad:#ff8f9c; --bad-soft:#43202a;
  --plum:#d9a6ec; --plum-soft:#3a2347; --top:#ff9db0; --top-soft:#45202a; --guide:#324638; --sun:#e8b45c; --sun-soft:#3b2d15;
  --r-iron:#a6acb3; --r-bronze:#dc9a64; --r-silver:#c6cfd7; --r-gold:#f1c64e; --r-plat:#5fd3c6; --r-diamond:#86b4ff; --r-master:#d9a2ff; --r-chall:#ff8fa3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.stack{display:flex;flex-direction:column;gap:14px}
section{display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--f-jp);font-size:25px;font-weight:700}
h1 span{color:var(--accent)}
[hidden]{display:none!important}
.tb-r{display:flex;align-items:center;gap:6px}
.acctbtn,.cashbtn{white-space:nowrap}
@media (max-width:380px){.redo{padding:4px 8px;font-size:11px}.redo svg{display:none}.cashbtn{padding:4px 8px}}
.cashbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--sun);border-radius:999px;padding:4px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;min-height:32px}
.cashbtn .num{color:var(--ink);font-variant-numeric:tabular-nums}
.packs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.pack{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 6px;font:inherit;cursor:pointer}
.pack b{font-size:16px}.pack span{font-size:12px;color:var(--muted)}
.pack i{font-style:normal;position:absolute;top:-9px;right:6px;font-size:10.5px;font-weight:700;background:var(--sun);color:var(--surface);border-radius:999px;padding:1px 7px}
.pack:hover{border-color:var(--accent)}
.paym{border:0;padding:0;margin:0;display:flex;gap:16px;flex-wrap:wrap}
.paym legend{margin-bottom:6px;padding:0}
.paym label{display:flex;align-items:center;gap:6px;font-size:14px}
.txl{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.txl li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.txl li small{display:block;color:var(--muted);font-size:11.5px}
.txl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.txl .pos{color:var(--good);font-weight:700}.txl .neg{color:var(--bad);font-weight:700}
.wlinfo summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent)}
.wlinfo ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.st-fast{background:var(--sun-soft);color:var(--sun)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:-6px}
.redo{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 10px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;min-height:28px;white-space:nowrap}
.redo:hover{color:var(--accent);border-color:var(--accent)}
.acctbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 11px 3px 3px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;min-height:32px}
.acctbtn .av,.acrow .av{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;flex:none;position:relative}
.acctbtn[data-s="in"] .av::after,.acctbtn[data-s="err"] .av::after,.acctbtn[data-s="warn"] .av::after,.acctbtn[data-s="busy"] .av::after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}
.acctbtn[data-s="err"] .av::after{background:var(--bad)}
.acctbtn[data-s="warn"] .av::after,.acctbtn[data-s="busy"] .av::after{background:var(--sun)}
.acrow{display:flex;align-items:center;gap:12px}
.acrow .av.big{width:46px;height:46px;font-size:19px}
.acname{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acmail{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ac-x{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:17px;line-height:1;padding:8px;margin:-8px -6px -8px 0}
.acstat{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:14px;padding:12px 14px}
.acstat b{font-size:15px}
.acok{margin:0;color:var(--good);font-size:13.5px;font-weight:500}
.acwarn{margin:0;font-size:13px;background:var(--sun-soft);color:var(--ink);border-radius:12px;padding:10px 12px}
.acwait{display:flex;align-items:center;gap:10px;margin:6px 0;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;padding:12px;border-radius:12px;cursor:pointer}
.gbtn .g-ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:13px;font-weight:700;color:var(--accent)}
.gbtn:disabled,.mopt:disabled{opacity:.55;cursor:default}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.mchoice{display:flex;flex-direction:column;gap:8px}
.mopt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;border-radius:14px;padding:12px 14px;cursor:pointer}
.mopt:hover{border-color:var(--accent)}
.mopt b{font-size:15px;color:var(--accent)}
.mopt span{font-size:14px}
.mopt small{font-size:12px;color:var(--muted)}
.wl-login{font-weight:500;color:var(--muted)}
.wl-login b{color:var(--accent)}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.4s}}
.pill{font-size:12px;font-weight:500;color:var(--good);background:var(--good-soft);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* level picker */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.lv b{font-size:17px}
.lv small{font-size:11.5px;color:var(--muted);line-height:1.35}
.lv[data-l="beg"]{--lc:var(--sun);--ls:var(--sun-soft)}
.lv[data-l="mid"]{--lc:var(--accent);--ls:var(--accent-soft)}
.lv[data-l="adv"]{--lc:var(--plum);--ls:var(--plum-soft)}
.lv[data-l="top"]{--lc:var(--top);--ls:var(--top-soft)}
.lv[aria-pressed="true"]{border-color:var(--lc);background:var(--ls)}
.lv[aria-pressed="true"] b{color:var(--lc)}
.fgbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fgbox .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fgbox p{margin:0;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font-size:13px;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}

/* chapter list */
.chapters{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;width:100%}
.ch .tag{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--lc);background:var(--ls);border-radius:8px;padding:4px 0;width:44px;text-align:center;flex:none}
.ch .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ch .txt b{font-size:15.5px}
.ch .txt span{font-size:12.5px;color:var(--muted)}
.ch .txt em{font-style:normal;font-size:12px;color:var(--lc);font-weight:500;font-variant-numeric:tabular-nums}
.ch .go{color:var(--muted);flex:none}
.rmstage[data-l="kana"],.chapters[data-l="kana"],.lvcard[data-l="kana"],.stg[data-l="kana"]{--lc:var(--good);--ls:var(--good-soft)}
.rmstage[data-l="beg"],.chapters[data-l="beg"],.lvcard[data-l="beg"],.stg[data-l="beg"]{--lc:var(--sun);--ls:var(--sun-soft)}
.rmstage[data-l="mid"],.chapters[data-l="mid"],.lvcard[data-l="mid"],.stg[data-l="mid"]{--lc:var(--accent);--ls:var(--accent-soft)}
.rmstage[data-l="adv"],.chapters[data-l="adv"],.lvcard[data-l="adv"],.stg[data-l="adv"]{--lc:var(--plum);--ls:var(--plum-soft)}
.rmstage[data-l="top"],.chapters[data-l="top"],.lvcard[data-l="top"],.stg[data-l="top"]{--lc:var(--top);--ls:var(--top-soft)}

/* chapter view */
.topbar{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.topbar h2{margin:0;font-size:19px;font-family:var(--f-jp);min-width:0}

/* furigana */
ruby.fg rt{font-size:.5em;color:var(--muted);font-family:var(--f-jp);font-weight:500}
ruby.hide{text-decoration:underline dotted var(--accent);text-underline-offset:.28em;cursor:pointer}
ruby.hide rt{visibility:hidden}
ruby.hide.peek rt{visibility:visible;color:var(--accent)}
.jp{font-family:var(--f-jp)}

/* kana */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 2px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.cell b{font-family:var(--f-jp);font-size:26px;font-weight:500;line-height:1.2}
.cell small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cell.empty{visibility:hidden}
.cell.on{border-color:var(--accent);background:var(--accent-soft)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:16px}
.detail .big{font-family:var(--f-jp);font-size:54px;line-height:1;min-width:64px;text-align:center}
.detail .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.detail .info strong{font-size:18px}
.speak{border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.weak{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-jp);font-size:16px;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:2px 9px}
.chip em{font-family:var(--f-mono);font-style:normal;font-size:11px;margin-left:4px}

/* quiz shared */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.q{font-family:var(--f-jp);font-size:84px;line-height:1.1;font-weight:500}
.qtext{font-size:17px;line-height:1.9;font-weight:500}
.qtext .jp{font-size:22px}
.alvsteps{display:flex;flex-direction:column;gap:8px}
.lshead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lsbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.lsbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.lscard{align-items:center;text-align:center;gap:10px;padding-block:28px}
.lsword{border:0;background:none;cursor:pointer;font-size:40px;line-height:1.4;color:var(--ink);padding:4px 10px;border-radius:12px}
.lsword:hover{background:var(--accent-soft)}
.lsmean{font-size:20px}
@media (prefers-reduced-motion: reduce){.lsbar i{transition:none}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.choices.col{grid-template-columns:1fr}
.choice{font-size:16px;font-weight:500;padding:13px 10px;border-radius:14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;line-height:1.7;display:flex;flex-direction:column;align-items:center}
.choice small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.choice .jp{font-size:19px}
.choice.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.choice.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.feedback{font-weight:500;min-height:22px}
.feedback.soft{color:var(--sun)}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.exp{font-size:14px;color:var(--muted);text-align:left;width:100%;margin:0}
.btn{border:0;background:var(--accent);color:var(--bg);font-weight:700;padding:12px 18px;border-radius:12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.wide{width:100%}
.progress{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* flashcards */
.fc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fc-word{font-family:var(--f-jp);font-size:54px;font-weight:700;line-height:1.5}
.fc-read{font-family:var(--f-jp);font-size:22px;color:var(--accent)}
.fc-mean{font-size:21px;font-weight:700}
.fc-ex{width:100%;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.fc-ex p{margin:0}
.fc-ex .jp{font-size:19px;line-height:2}
.fc-ex .ko{color:var(--muted);font-size:14px}
.fc-note{margin:0;font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 12px;width:100%;text-align:left}
.hint{font-size:13px;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate button{border:0;border-radius:12px;padding:10px 4px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px}
.rate small{font-weight:500;font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.85}
.r0{background:var(--bad-soft);color:var(--bad)}
.r1{background:var(--bg);color:var(--muted);border:1px solid var(--line)!important}
.r2{background:var(--accent-soft);color:var(--accent)}
.r3{background:var(--good-soft);color:var(--good)}
.counts{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.counts b{color:var(--ink)}

/* lessons */
.intro{margin:0;color:var(--muted)}
.point{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.point .pat{font-family:var(--f-jp);font-size:22px;font-weight:700;line-height:1.8}
.point .mean{align-self:flex-start;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 9px}
.point p{margin:0;font-size:14px}
.ex{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line);padding-left:12px}
.ex div{display:flex;flex-direction:column}
.ex .jp{font-size:18px;line-height:1.9}
.ex .ko{font-size:13.5px;color:var(--muted)}

 {id:"polite",type:"lesson",tag:"회화",title:"존댓말과 반말",desc:"같은 말을 두 가지 말투로 바꿔 보기",

   {pat:"〜ません / 〜ない",mean:"안 해요 / 안 해",desc:"부정은 존댓말이 ません, 반말이 ない예요.",pairs:[["{食|た|N5}べません。","{食|た|N5}べない。","안 먹어요 / 안 먹어"],["{行|い|N5}きません。","{行|い|N5}かない。","안 가요 / 안 가"]]},
   {pat:"〜ました / 〜た",mean:"했어요 / 했어",desc:"과거는 존댓말이 ました, 반말이 た예요. 行く→行った처럼 모양이 바뀌는 동사도 있어요.",pairs:[["{見|み|N5}ました。","{見|み|N5}た。","봤어요 / 봤어"],["{行|い|N5}きました。","{行|い|N5}った。","갔어요 / 갔어"]]},

 {id:"lyric6",type:"lesson",tag:"가사",title:"J-POP 단골 가사 TOP 6",desc:"일본인이 ‘지겹다’고 뽑은 가사로 배우는 문법",
  intro:"SNS에서 유명한 ‘일본인이 뽑은 J-POP 지겨운 가사’ 순위예요. 너무 자주 나와서 지겹다는 말까지 듣는 문장이라, 외워 두면 노래에서 가장 많이 들리는 표현이 돼요. 한 곡의 가사가 아니라 수많은 노래에 공통으로 나오는 짧은 문장이에요. 각 문장 속 문법을 뜯어보고, 같은 문법으로 만든 일상 예문까지 익혀 보세요.",
  note:"순위와 비율은 SNS에 퍼진 설문 이미지 기준이며, 원 출처는 확인되지 않았어요.",
  points:[
   {rank:"1위 · 20.6%",pat:"{一人|ひとり|N5}じゃない",mean:"혼자가 아니야",desc:"一人(혼자) + じゃない(~이 아니다). 첫 챕터 だ・だった・だって에서 배운 부정형 그대로예요. 一人는 いちにん이 아니라 ひとり, 二人는 ふたり로 읽는 특별한 읽기예요.",ex:[["{今日|きょう|N5}は{一人|ひとり|N5}じゃない。{友達|ともだち|N5}と{一緒|いっしょ|N4}だ。","오늘은 혼자가 아니야. 친구랑 같이야."],["{二人|ふたり|N5}で{行|い|N5}こう。","둘이서 가자."]]},
   {rank:"2위 · 15.6%",pat:"{君|きみ|N3}を{守|まも|N4}りたい",mean:"너를 지키고 싶어",desc:"守る(지키다)의 ます형 어간 守り + たい(~하고 싶다). 君는 가사 속 단골 ‘너’지만, 실제 회화에서 윗사람에게 쓰면 실례예요.",ex:[["{日本|にほん|N5}に{行|い|N5}きたい。","일본에 가고 싶어."],["{約束|やくそく|N4}を{守|まも|N4}りたい。","약속을 지키고 싶어."]]},
   {rank:"3위 · 8.4%",pat:"その{手|て|N5}を{離|はな|N3}さない",mean:"그 손을 놓지 않을게",desc:"離す(놓다)의 부정형 離さない가 ‘절대 ~하지 않겠다’는 의지를 나타내요. ‘놓지 마’라는 부탁은 離さないで예요. 원본 이미지의 ‘놓지마’ 번역은 틀린 해석이에요. 離す(놓다, 타동사)와 離れる(떨어지다, 자동사)도 구분해 두세요.",ex:[["{手|て|N5}を{離|はな|N3}さないで。","손 놓지 마."],["{家族|かぞく|N5}と{離|はな|N3}れて{暮|く|N3}らしている。","가족과 떨어져 살고 있다."]]},
   {rank:"4위 · 7.3%",pat:"あのころに{戻|もど|N3}れたら",mean:"그 시절로 돌아갈 수 있다면",desc:"戻る(돌아가다) → 가능형 戻れる → 과거형 戻れた + ら(~라면). 가능형 + たら는 ‘~할 수 있다면’이에요. あのころ는 ‘그 무렵’.",ex:[["もっと{時間|じかん|N5}があったら、{旅行|りょこう|N4}したい。","시간이 더 있다면 여행하고 싶어."],["{日本語|にほんご|N5}が{話|はな|N5}せたら、{楽|たの|N4}しいだろうな。","일본어를 할 수 있다면 즐겁겠지."]]},
   {rank:"5위 · 6.7%",pat:"{君|きみ|N3}の{名|な|N4}を{呼|よ|N4}んだ",mean:"너의 이름을 불렀어",desc:"呼ぶ(부르다)의 과거형은 呼んだ. ぶ·む·ぬ로 끝나는 동사는 과거형이 んだ가 돼요. 名(な) 하나만 쓰는 건 가사·문어체이고, 회화에서는 名前(なまえ)라고 해요.",ex:[["{友達|ともだち|N5}を{呼|よ|N4}んだ。","친구를 불렀어."],["{昨日|きのう|N5}、この{本|ほん|N5}を{読|よ|N5}んだ。","어제 이 책을 읽었어."]]},
   {rank:"공동 5위 · 6.7%",pat:"{届|とど|N3}かない{想|おも|N3}い",mean:"닿지 않는 마음",desc:"届く(닿다)의 부정형 届かない가 뒤의 명사 想い를 그대로 꾸며요. 일본어는 동사 부정형을 바로 명사 앞에 붙일 수 있어요. 想い는 思い보다 감정이 짙은 표기라 가사에 자주 나와요.",ex:[["{手紙|てがみ|N5}が{届|とど|N3}いた。","편지가 도착했어."],["{知|し|N5}らない{人|ひと|N5}についていかないで。","모르는 사람을 따라가지 마."]]}
  ],

   {q:"“너를 지키고 싶어”",c:["{君|きみ|N3}を{守|まも|N4}りたい","{君|きみ|N3}を{守|まも|N4}った","{君|きみ|N3}を{守|まも|N4}ろう","{君|きみ|N3}を{守|まも|N4}らない"],e:"ます형 어간 + たい = ~하고 싶다."},
   {q:"<span class='jp'>その{手|て|N5}を{離|はな|N3}さない</span><br>뜻으로 알맞은 것은?",c:["그 손을 놓지 않을게","그 손을 놓지 마","그 손을 놓았다","그 손을 잡고 싶어"],e:"부정형 離さない는 ‘놓지 않겠다’는 의지예요. ‘놓지 마’는 離さないで."},
   {q:"“손 놓지 마!”라고 부탁할 때",c:["{手|て|N5}を{離|はな|N3}さないで","{手|て|N5}を{離|はな|N3}さない","{手|て|N5}が{離|はな|N3}れない","{手|て|N5}を{離|はな|N3}したい"],e:"부정형 + で = ~하지 마(부탁)."},
   {q:"<span class='jp'>あのころに{戻|もど|N3}れたら</span><br>れたら가 나타내는 뜻은?",c:["~할 수 있다면","~하고 싶다","~해 버렸다","~하지 마"],e:"가능형(戻れる) + たら = ~할 수 있다면."},
   {q:"「{呼|よ|N4}ぶ」의 과거형은?",c:["{呼|よ|N4}んだ","{呼|よ|N4}びた","{呼|よ|N4}った","{呼|よ|N4}いだ"],e:"ぶ·む·ぬ로 끝나는 동사는 과거형이 んだ예요. 読む→読んだ, 死ぬ→死んだ."},
   {q:"<span class='jp'>{届|とど|N3}かない{想|おも|N3}い</span><br>届かない의 역할은?",c:["뒤의 명사를 꾸민다","문장을 끝낸다","명령을 나타낸다","과거를 나타낸다"],e:"동사 부정형이 명사 앞에서 그대로 꾸미는 말이 돼요."},
   {q:"이 순위에 두 번 나온, 가사 속 단골 ‘너’는?",c:["君","あなた","お前","貴様"],e:"君는 2위와 5위에 나와요. 회화에서 윗사람에게 쓰면 실례이니 가사로만 익혀 두세요."}

   {rank:"緑黄色社会 · 앨범 『あたまご』",link:"https://open.spotify.com/track/38hwaY5sTCF10gXtyweWAX?utm_source=anthropic&utm_medium=claude&go=1&nap_web=1&request_id=24b37f01-f456-4812-af9e-c6a2a5ac585d",pat:"{分|わ|N5}かりにくい",mean:"알기 어려운",desc:"分かる(알다, 이해하다)의 ます형 어간 分かり에 にくい(~하기 어렵다)가 붙었어요. 반대는 やすい(~하기 쉽다)라서 分かりやすい는 ‘알기 쉬운’이에요. 동사 + にくい/やすい는 회화에서 정말 자주 써요.",ex:[["この{説明|せつめい|N4}は{分|わ|N5}かりにくい。","이 설명은 이해하기 어려워."],["この{本|ほん|N5}は{読|よ|N5}みやすい。","이 책은 읽기 쉬워."]]},

   {rank:"緑黄色社会 · 앨범 『あたまご』",link:"https://open.spotify.com/track/1bcoTmXFb4r9XJkDYla7Dk?utm_source=anthropic&utm_medium=claude&go=1&nap_web=1&request_id=24b37f01-f456-4812-af9e-c6a2a5ac585d",pat:"{章|しるし}",mean:"표시, 증표 (제목만의 특별한 읽기)",desc:"章는 보통 しょう라고 읽고 ‘장, 챕터’라는 뜻이에요(第一章 だいいっしょう, 제1장). 이 곡 제목은 같은 한자를 しるし로 읽어요. しるし는 ‘표시, 증표’라는 뜻의 말로, 평소에는 印로 써요. 가사와 제목에서는 이렇게 한자에 일부러 다른 읽기를 붙이는 경우가 많아서, 처음 보는 제목은 읽기부터 확인하는 게 좋아요.",ex:[["{印|しるし|N2}をつける。","표시를 하다."],["{第一章|だいいっしょう|N3}を{読|よ|N5}み{終|お|N4}わった。","제1장을 다 읽었다. (보통 읽기 しょう)"]]},

   {rank:"aiko · 앨범 제목",pat:"{今|いま|N5}の{二人|ふたり|N5}をお{互|たが|N3}いが{見|み|N5}てる",mean:"지금의 두 사람을 서로가 보고 있어",desc:"お互い(おたがい)는 ‘서로’라는 뜻이에요. 見てる는 見ている에서 い를 뺀 회화체 줄임말이에요. 노래 제목과 가사에는 〜てる, 〜でる 같은 구어체가 자주 나와요.",ex:[["お{互|たが|N3}いに{助|たす|N4}け{合|あ|N5}おう。","서로 도우며 지내자."],["{今|いま|N5}、テレビを{見|み|N5}てる。","지금 TV 보고 있어."]]},

 {id:"speech",type:"lesson",tag:"표현",title:"애니 말투와 가사 읽기",desc:"캐릭터 말투, 가사 속 특수 읽기",

 {id:"g43",type:"lesson",tag:"문법",title:"N4~N3 핵심 문법",desc:"헷갈리기 쉬운 7가지 표현",

   {q:"하늘이 어두워졌다. 곧 비가 올 것 같다<br><span class='jp'>{雨|あめ|N5}が___。</span>",c:["{降|ふ|N5}りそうだ","{降|ふ|N5}るそうだ","{降|ふ|N5}ったそうだ","{降|ふ|N5}ったようだ"],e:"눈으로 보고 판단하니 ます형 어간 + そうだ. {降|ふ|N5}るそうだ는 들은 말, {降|ふ|N5}ったようだ는 이미 내린 흔적을 보고 하는 추측이에요."},
   {q:"뉴스에 따르면 내일 비가 온다고 한다<br><span class='jp'>{明日|あした|N5}は{雨|あめ|N5}が___。</span>",c:["{降|ふ|N5}るそうだ","{降|ふ|N5}りそうだ","{降|ふ|N5}ったそうだ","{降|ふ|N5}らないそうだ"],e:"들은 정보를 전하니 기본형 + そうだ. {降|ふ|N5}ったそうだ는 이미 내렸다는 말이라 ‘내일’과 맞지 않아요."},
   {q:"지갑을 잃어버려 버렸다<br><span class='jp'>{財布|さいふ|N4}を___。</span>",c:["なくしてしまった","なくしてみた","なくしておいた","なくしそうだった"],e:"원치 않은 일이 끝나 버렸으니 〜てしまった. 〜てみた는 ‘해 봤다’, 〜ておいた는 ‘미리 해 뒀다’예요."},
   {q:"어젯밤 늦게 자서 피곤하다. 더 일찍 잘걸<br><span class='jp'>もっと{早|はや|N5}く___。</span>",c:["{寝|ね|N5}ればよかった","{寝|ね|N5}てしまった","{寝|ね|N5}ることになった","{寝|ね|N5}そうだった"],e:"하지 않은 일에 대한 후회는 〜ばよかった."},
   {q:"회사 명령으로 오사카에 가게 됐다<br><span class='jp'>{大阪|おおさか}に___。</span>",c:["{行|い|N5}くことになった","{行|い|N5}くことにした","{行|い|N5}くようにした","{行|い|N5}きそうだった"],e:"바깥에서 정해졌으니 ことになる. 스스로 정했으면 ことにする예요."},
   {q:"“싫은 건 아니야”<br><span class='jp'>{嫌|きら|N4}いな___。</span>",c:["わけではない","わけがない","はずがない","ふりをしない"],e:"일부만 부정할 땐 〜わけではない. 〜わけがない·〜はずがない는 ‘~일 리가 없다’, 〜ふりをしない는 ‘~인 척하지 않는다’예요."},
   {q:"건강을 위해 매일 걸으려고 하고 있다<br><span class='jp'>{毎日|まいにち|N5}{歩|ある|N5}く___。</span>",c:["ようにしている","ことになっている","ふりをしている","のをやめている"],e:"습관을 위한 노력은 〜ようにしている. 〜ことになっている는 규칙·예정, 〜ふりをしている는 ‘~하는 척’이에요."},
   {q:"<span class='jp'>{春|はる|N5}らしい{天気|てんき|N5}</span><br>여기서 らしい의 뜻은?",c:["~다운","~인 것 같은","~라고 하는","~이 아닌"],e:"명사 + らしい가 명사를 꾸미면 ‘~다운’이에요. ‘~인 것 같다’는 추측의 らしい로, 문장 끝에서 주로 써요."}
  ]}
],

 {id:"n2g",type:"lesson",tag:"문법",title:"N2 문법",desc:"회사 메일·뉴스에 바로 나오는 표현 8가지",
  intro:"N2 문법은 회사 메일, 뉴스, 안내문에서 바로 쓰이는 표현이 많아요. 뜻이 비슷한 것끼리 묶어서 어떤 장면에 쓰는지 함께 기억하세요.",
  points:[
   {pat:"〜に{伴|ともな|N2}って",mean:"~에 따라 (함께 변함)",desc:"한쪽이 변하면 다른 쪽도 함께 변할 때 써요. 뉴스와 안내문에 자주 나와요.",ex:[["{人口|じんこう|N2}の{増加|ぞうか|N2}に{伴|ともな|N2}って、{住宅|じゅうたく|N2}{不足|ぶそく|N2}が{深刻|しんこく|N2}になった。","인구 증가에 따라 주택 부족이 심각해졌다."]]},
   {pat:"〜わけにはいかない",mean:"~할 수는 없다 (사정상)",desc:"하고 싶어도 상식·책임·사정 때문에 할 수 없을 때 써요.",ex:[["{明日|あした|N5}は{試験|しけん|N4}だから、{休|やす|N5}むわけにはいかない。","내일은 시험이라 쉴 수는 없다."]]},
   {pat:"〜に{限|かぎ|N3}って",mean:"하필 ~할 때만 / ~만은 (그럴 리 없다)",desc:"하필 그때 안 좋은 일이 생겼다고 불평하거나, ‘그 사람만은 그럴 리 없다’고 믿을 때 써요.",ex:[["{急|いそ|N4}いでいる{時|とき|N5}に{限|かぎ|N3}って、{電車|でんしゃ|N5}が{遅|おく|N4}れる。","하필 서두를 때만 전철이 늦는다."],["うちの{子|こ|N5}に{限|かぎ|N3}って、そんなことはしない。","우리 애만은 그런 짓 안 해."]]},
   {pat:"〜ものの",mean:"~이긴 하지만",desc:"앞의 사실은 인정하면서 기대와 다른 결과를 말할 때 써요. けれども보다 딱딱해요.",ex:[["{免許|めんきょ|N2}は{取|と|N4}ったものの、まだ{運転|うんてん|N4}が{怖|こわ|N3}い。","면허는 땄지만 아직 운전이 무섭다."]]},
   {pat:"〜に{越|こ|N2}したことはない",mean:"~하는 게 제일이다",desc:"당연히 그쪽이 더 좋다고 조언할 때 써요.",ex:[["{準備|じゅんび|N4}は{早|はや|N5}いに{越|こ|N2}したことはない。","준비는 빠를수록 좋다."]]},
   {pat:"〜かねない",mean:"~할 수도 있다 (나쁜 결과)",desc:"나쁜 결과가 생길 위험이 있을 때만 써요. 좋은 일에는 쓰지 않아요.",ex:[["{寝不足|ねぶそく|N2}での{運転|うんてん|N4}は{事故|じこ|N4}につながりかねない。","잠이 부족한 채로 운전하면 사고로 이어질 수도 있다."]]},
   {pat:"〜からこそ",mean:"~이기 때문에 (더욱)",desc:"이유를 강조해요. ‘그래서 오히려’라는 느낌이 담겨요.",ex:[["{失敗|しっぱい|N3}したからこそ、{学|まな|N3}べたことがある。","실패했기 때문에 비로소 배운 것이 있다."]]},
   {pat:"〜を{踏|ふ|N2}まえて",mean:"~을 바탕으로",desc:"회의나 보고서에서 앞의 결과·의견을 토대로 다음 행동을 정할 때 써요.",ex:[["{調査|ちょうさ|N2}{結果|けっか|N3}を{踏|ふ|N2}まえて、{計画|けいかく|N4}を{見直|みなお|N2}す。","조사 결과를 바탕으로 계획을 다시 검토한다."]]}
  ],
  quiz:[
   {q:"물가 상승에 따라 생활비도 늘었다<br><span class='jp'>{物価|ぶっか|N2}の{上昇|じょうしょう|N2}___、{生活費|せいかつひ|N2}も{増|ふ|N4}えた。</span>",c:["に伴って","に限って","に反して","に対して"],e:"한쪽이 변하면서 다른 쪽도 함께 변하니 〜に伴って. 〜に反して는 ‘~와 반대로’, 〜に対して는 ‘~에 대해’예요."},
   {q:"약속했으니 이제 와서 그만둘 수는 없다<br><span class='jp'>{約束|やくそく|N4}したから、{今更|いまさら|N2}やめる___。</span>",c:["わけにはいかない","わけがない","はずがない","ことはない"],e:"사정·책임 때문에 할 수 없으니 〜わけにはいかない. 〜ことはない는 ‘~할 필요는 없다’예요."},
   {q:"우산을 안 가져온 날에만 꼭 비가 온다<br><span class='jp'>{傘|かさ|N4}を{持|も|N5}っていない{日|ひ|N5}___、{雨|あめ|N5}が{降|ふ|N5}る。</span>",c:["に限って","に伴って","に対して","にとって"],e:"하필 그럴 때만 안 좋은 일이 생기니 〜に限って."},
   {q:"책은 샀지만 아직 안 읽었다<br><span class='jp'>{本|ほん|N5}は{買|か|N5}った___、まだ{読|よ|N5}んでいない。</span>",c:["ものの","ものだから","からこそ","とたん"],e:"앞의 사실은 인정하고 기대와 다른 결과를 말하니 〜ものの. 〜ものだから·〜からこそ는 이유, 〜とたん은 ‘~하자마자’예요."},
   {q:"건강을 위해서는 일찍 자는 게 제일이다<br><span class='jp'>{健康|けんこう|N3}のためには、{早|はや|N5}く{寝|ね|N5}る___。</span>",c:["に越したことはない","わけにはいかない","はずがない","わけではない"],e:"당연히 그게 제일 좋다는 조언이니 〜に越したことはない."},
   {q:"이대로라면 큰 문제가 될 수도 있다<br><span class='jp'>このままでは{大|おお|N5}きな{問題|もんだい|N4}になり___。</span>",c:["かねない","そうにない","っこない","きれない"],e:"나쁜 결과가 생길 위험은 〜かねない. 〜そうにない는 ‘~할 것 같지 않다’, 〜っこない는 ‘~할 리 없다’, 〜きれない는 ‘다 ~하지 못한다’예요."},
   {q:"너를 믿기 때문에 더 엄하게 말하는 거야<br><span class='jp'>{君|きみ|N3}を{信|しん|N3}じている___、{厳|きび|N2}しく{言|い|N5}うんだ。</span>",c:["からこそ","からといって","ものの","くせに"],e:"이유를 강조하니 〜からこそ. 〜からといって는 ‘~라고 해서’, 〜くせに는 ‘~인 주제에’예요."},
   {q:"여러분의 의견을 바탕으로 새 기획을 세웠습니다<br><span class='jp'>{皆様|みなさま|N3}のご{意見|いけん|N4}___、{新|あたら|N5}しい{企画|きかく|N2}を{立|た|N4}てました。</span>",c:["を踏まえて","をめぐって","に限って","に反して"],e:"의견을 토대로 했으니 〜を踏まえて. 〜をめぐって는 ‘~을 둘러싸고’, 〜に反して는 ‘~와 반대로’예요."}
  ]},
 {id:"keigo",type:"lesson",tag:"회화",title:"비즈니스 경어",desc:"N2 이후에도 틀리기 쉬운 존경어·겸양어",
  intro:"N2를 따도 일본 회사에서 가장 많이 지적받는 게 경어예요. 상대의 행동을 높이는지(존경어), 내 행동을 낮추는지(겸양어)부터 구분하세요. 외부 사람 앞에서는 우리 회사 상사도 낮춘다는 점이 한국어와 가장 달라요.",
  points:[
   {pat:"いらっしゃる / {参|まい|N3}る",mean:"가다·오다·있다의 존경어 / 겸양어",desc:"상대의 행동은 いらっしゃる로 높이고, 내 행동은 参る로 낮춰요. 주어가 누구인지가 핵심이에요.",ex:[["{部長|ぶちょう|N2}は{会議室|かいぎしつ|N3}にいらっしゃいます。","부장님은 회의실에 계십니다. (사내에서)"],["{明日|あした|N5}、{御社|おんしゃ|N1}に{参|まい|N3}ります。","내일 귀사로 찾아뵙겠습니다."]]},

function renderKana(ch){
  const s=ch.script,body=$("chBody");
  body.innerHTML=`<div class="seg" id="kSeg" style="align-self:flex-start"><button aria-pressed="true" data-m="chart">글자 표</button><button aria-pressed="false" data-m="quiz">읽기 퀴즈</button><button aria-pressed="false" data-m="write">따라 쓰기</button></div><div id="kBox" class="stack"></div>`;
  $("kSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;$("kSeg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));b.dataset.m==="chart"?chart():b.dataset.m==="quiz"?quiz():kanaWrite($("kBox"),s,ch_)};
  const ch_=k=>s==="h"?k.h:k.k;
  function chart(){
    let sel=KANA[0];const box=$("kBox");
    box.innerHTML=`<div class="detail"><div class="big" id="dBig"></div><div class="info"><strong id="dKo"></strong><span class="sub" id="dRom"></span></div><button class="speak" id="dSpeak" aria-label="발음 듣기">${ICON}</button></div><div class="grid" id="grid"></div><p class="note">글자를 누르면 발음이 나와요.</p>`;
    function show(){$("dBig").textContent=ch_(sel);$("dKo").textContent=sel.ko;$("dRom").textContent=`${sel.rom} · ${sel.row} · 짝 ${s==="h"?sel.k:sel.h}`}
    function grid(){const g=$("grid");g.innerHTML="";ROWS.forEach(([r,cs])=>cs.forEach(c=>{const el=document.createElement("button");el.className="cell";
      if(!c){el.classList.add("empty");el.tabIndex=-1;el.setAttribute("aria-hidden","true");g.appendChild(el);return}
      const k=KANA.find(x=>x.h===c[0]);el.innerHTML=`<b>${ch_(k)}</b><small>${k.rom}</small>`;if(k===sel)el.classList.add("on");
      el.onclick=()=>{sel=k;show();grid();speak(ch_(k))};g.appendChild(el)}))}
    $("dSpeak").onclick=()=>speak(ch_(sel));show();grid();
  }
  function quiz(){
    let st=store.get("kq_"+s,{right:0,total:0,streak:0,best:0,miss:{}}),cur=null;const box=$("kBox");
    box.innerHTML=`<div class="stats"><div class="stat"><b id="sScore"></b><span>맞힌 수</span></div><div class="stat"><b id="sStreak"></b><span>연속 정답</span></div><div class="stat"><b id="sBest"></b><span>최고 연속</span></div></div>
    <div class="card"><span class="label">이 글자는 어떻게 읽을까요?</span><div class="q" id="qChar"></div><div class="choices" id="choices"></div><div class="feedback" id="fb"></div></div>
    <div class="stack" style="gap:6px"><span class="label">자주 틀린 글자</span><div class="weak" id="weak"></div></div>
    <button class="btn ghost small" id="kReset" style="align-self:flex-start">기록 초기화</button>`;
    function stats(){$("sScore").textContent=`${st.right}/${st.total}`;$("sStreak").textContent=st.streak;$("sBest").textContent=st.best;
      const w=Object.entries(st.miss).sort((a,b)=>b[1]-a[1]).slice(0,10);
      $("weak").innerHTML=w.length?w.map(([h,n])=>{const k=KANA.find(x=>x.h===h);return `<span class="chip">${ch_(k)}<em>${k.rom} ×${n}</em></span>`}).join(""):'<span class="sub">아직 없어요. 틀린 글자가 여기 모이고 더 자주 출제돼요.</span>'}
    function next(){
      if(!$("choices"))return;
      const wts=KANA.map(k=>1+(st.miss[k.h]||0)*2),sum=wts.reduce((a,b)=>a+b,0);let r=Math.random()*sum,i=0;while(r>wts[i]){r-=wts[i];i++}
      let n=KANA[i];if(n===cur)n=KANA[(i+1)%KANA.length];cur=n;
      $("qChar").textContent=ch_(cur);$("fb").textContent="";$("fb").className="feedback";
      const opts=[cur];while(opts.length<4){const o=KANA[Math.floor(Math.random()*KANA.length)];if(!opts.some(x=>x.rom===o.rom||x.ko===o.ko))opts.push(o)}
      $("choices").innerHTML="";shuffle(opts).forEach(o=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`${o.ko}<small>${o.rom}</small>`;b.onclick=()=>answer(o,b);b.dataset.r=o.rom;$("choices").appendChild(b)});

      if(o===cur){st.right++;st.streak++;st.best=Math.max(st.best,st.streak);b.classList.add("ok");fb.textContent="정답이에요!";fb.className="feedback ok";if(st.miss[cur.h]&&!--st.miss[cur.h])delete st.miss[cur.h]}
      else{st.streak=0;st.miss[cur.h]=(st.miss[cur.h]||0)+1;b.classList.add("no");$("choices").querySelector(`[data-r="${cur.rom}"]`).classList.add("ok");fb.textContent=`${ch_(cur)}는 ‘${cur.ko}’(${cur.rom})로 읽어요`;fb.className="feedback no"}
      speak(ch_(cur));store.set("kq_"+s,st);markStudy("quiz",o===cur);stats();setTimeout(next,o===cur?800:1700);
    }
    $("kReset").onclick=()=>{st={right:0,total:0,streak:0,best:0,miss:{}};store.set("kq_"+s,st);stats();next()};
    stats();next();
  }

function kanaWrite(box,s,ch_){
  let idx=Math.min(store.get("kwi_"+s,0),KANA.length-1),strokes=false,drawing=false,last=null;const done=new Set(store.get("kw_"+s,[]));
  box.innerHTML=`<div class="detail"><div class="big" id="wChar"></div><div class="info"><strong id="wKo"></strong><span class="sub" id="wRom"></span></div><button class="speak" id="wSay" aria-label="발음 듣기">${ICON}</button></div>
    <div class="cvwrap"><canvas id="cvG" aria-hidden="true"></canvas><canvas id="cvD" aria-label="글자를 따라 쓰는 칸"></canvas></div>
    <div class="trow"><label class="toggle" for="wGuide"><input type="checkbox" id="wGuide" checked>가이드 글자 보기</label><span class="sub" id="wDone"></span></div>
    <div class="feedback" id="wFb"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn ghost" id="wClear">지우기</button><button class="btn" id="wCheck">채점하기</button></div>
    <div class="trow"><button class="btn ghost small" id="wPrev">← 이전</button><span class="label" id="wPos" style="font-variant-numeric:tabular-nums"></span><button class="btn ghost small" id="wNext">다음 →</button></div>
    <p class="note">획순은 표시되지 않아요. 가이드를 끄고 써 보면 외웠는지 확인할 수 있어요.</p>`;
  const cvG=$("cvG"),cvD=$("cvD"),S=300,dpr=Math.min(3,window.devicePixelRatio||1);
  [cvG,cvD].forEach(c=>{c.width=S*dpr;c.height=S*dpr;c.getContext("2d").setTransform(dpr,0,0,dpr,0,0)});
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888";
  const FONT=sz=>`500 ${sz}px "Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif`;
  const glyph=(ctx,size,ch,color)=>{ctx.fillStyle=color;ctx.font=FONT(size*.78);ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(ch,size/2,size*.53)};
  const cur=()=>ch_(KANA[idx]);
  const fb=(m,c)=>{$("wFb").textContent=m;$("wFb").className="feedback "+c};
  function guide(){const g=cvG.getContext("2d");g.clearRect(0,0,S,S);g.strokeStyle=css("--line");g.lineWidth=1;g.setLineDash([6,6]);g.beginPath();g.moveTo(S/2,0);g.lineTo(S/2,S);g.moveTo(0,S/2);g.lineTo(S,S/2);g.stroke();g.setLineDash([]);if($("wGuide").checked)glyph(g,S,cur(),css("--guide"))}
  function clear(){cvD.getContext("2d").clearRect(0,0,S,S);strokes=false}
  function show(){const k=KANA[idx];$("wChar").textContent=cur();$("wKo").textContent=k.ko;$("wRom").textContent=k.rom+(done.has(k.h)?" · 잘 쓴 글자":"");$("wPos").textContent=`${idx+1} / ${KANA.length}`;$("wDone").textContent=`잘 쓴 글자 ${done.size}/${KANA.length}`;clear();guide();fb("","");store.set("kwi_"+s,idx)}
  const pos=e=>{const r=cvD.getBoundingClientRect();return [(e.clientX-r.left)*S/r.width,(e.clientY-r.top)*S/r.height]};
  cvD.onpointerdown=e=>{e.preventDefault();drawing=true;try{cvD.setPointerCapture(e.pointerId)}catch(_){}last=pos(e);const c=cvD.getContext("2d");c.fillStyle=css("--ink");c.beginPath();c.arc(last[0],last[1],7,0,Math.PI*2);c.fill();strokes=true};
  cvD.onpointermove=e=>{if(!drawing)return;e.preventDefault();const p=pos(e),c=cvD.getContext("2d");c.strokeStyle=css("--ink");c.lineWidth=14;c.lineCap="round";c.lineJoin="round";c.beginPath();c.moveTo(last[0],last[1]);c.lineTo(p[0],p[1]);c.stroke();last=p};
  cvD.onpointerup=cvD.onpointercancel=cvD.onpointerleave=()=>{drawing=false};
  function grade(){
    if(!strokes)return fb("먼저 글자를 써 주세요.","no");
    const N=100,mk=()=>{const c=document.createElement("canvas");c.width=c.height=N;return c},m=mk(),mc=m.getContext("2d");glyph(mc,N,cur(),"#000");
    const u=mk(),uc=u.getContext("2d");uc.drawImage(cvD,0,0,N,N);const gd=mc.getImageData(0,0,N,N).data,ud=uc.getImageData(0,0,N,N).data;
    const G=new Uint8Array(N*N),U=new Uint8Array(N*N);for(let i=0;i<N*N;i++){G[i]=gd[i*4+3]>100?1:0;U[i]=ud[i*4+3]>60?1:0}
    const dil=(A,r)=>{const B=new Uint8Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(A[y*N+x])for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<N&&xx>=0&&xx<N)B[yy*N+xx]=1}return B};
    const Ud=dil(U,3),Gd=dil(G,4);let g1=0,gc=0,u1=0,uc1=0;for(let i=0;i<N*N;i++){if(G[i]){g1++;if(Ud[i])gc++}if(U[i]){u1++;if(Gd[i])uc1++}}
    const score=Math.round(((g1?gc/g1:0)*.6+(u1?uc1/u1:0)*.4)*100);
    markStudy("write");
    if(score>=75){done.add(KANA[idx].h);store.set("kw_"+s,[...done]);$("wDone").textContent=`잘 쓴 글자 ${done.size}/${KANA.length}`;fb(`잘 썼어요! ${score}점`,"ok")}
    else if(score>=50)fb(`거의 다 왔어요. ${score}점 · 가이드를 따라 한 번 더 써 보세요.`,"no");
    else fb(`모양이 많이 달라요. ${score}점 · 가이드를 보며 천천히 써 보세요.`,"no");
  }
  $("wGuide").onchange=guide;$("wClear").onclick=()=>{clear();fb("","")};$("wCheck").onclick=grade;$("wSay").onclick=()=>speak(cur());
  $("wPrev").onclick=()=>{idx=(idx-1+KANA.length)%KANA.length;show()};$("wNext").onclick=()=>{idx=(idx+1)%KANA.length;show()};
  (document.fonts&&document.fonts.load?document.fonts.load(FONT(200),"あア").catch(()=>{}):Promise.resolve()).then(()=>{if($("cvG"))show()});
}

  const qB=k=>({q:`‘${k.rom} · ${k.ko}’ 소리가 나는 글자는?`,c:[k.h,...others(k).map(x=>x.h)],e:`${k.rom}(${k.ko})는 ${k.h}예요.`,k});
  const words=Object.values(KEX).filter(w=>[...w[0].replace(/ /g,"")].every(ch=>has.has(ch)));
  const qW=w=>{const r=kana2rom(w[0]),ds=shuffle(words.filter(x=>x!==w&&kana2rom(x[0])!==r)).slice(0,3).map(x=>kana2rom(x[0]));return ds.length<3?null:{q:`<span class="kq kqw">${w[0]}</span>이 단어의 읽기는?`,c:[r,...ds],e:`${w[0]}는 ${r}(${kana2han(w[0])}), 뜻은 ‘${w[1]}’예요.`}};

          ${wr.length?`<div class="review"><span class="label">틀린 문제</span>${wr.map(q=>`<div>${q.q.replace(/<rt>[^<]*<\/rt>/g,"").replace(/<[^>]+>/g," ")}<br><b>정답: ${q.c[0]}</b><br><span class="sub">${q.e}</span></div>`).join("")}</div>`:""}
          ${pass&&nextOpen?`<button class="btn wide" id="alvNext">Lv.${Lv+1} 퀴즈로</button>`:pass&&nx?`<p class="sub" style="margin:0">Lv.${Lv+1} 퀴즈는 레벨이 오르면 열려요. 다음 레벨까지 ${xpFor(lvOf(xp)+1)-xp} XP 남았어요.</p>`:""}
          <div style="display:flex;gap:8px;width:100%"><button class="btn ghost" id="alvList" style="flex:1">레벨 목록</button><button class="btn ghost" id="alvAgain" style="flex:1">${pass?"다시 풀기":"단어 다시 보기"}</button></div></div>`;
        if($("alvNext"))$("alvNext").onclick=()=>learn(Lv+1);
        $("alvList").onclick=()=>{list();window.scrollTo(0,0)};$("alvAgain").onclick=()=>pass?quiz(Lv):learn(Lv);window.scrollTo(0,0);

}

/* ---------- SRS deck (Anki style) ---------- */
function schedule(st,r){
  st=st?{...st}:{ivl:0,ease:2.5,reps:0};const now=Date.now();
  if(r===0){st.reps=0;st.ivl=0;st.ease=Math.max(1.3,st.ease-.2);st.due=now+60000;return st}
  if(r===1){st.ivl=st.reps===0?1:Math.max(st.ivl+1,Math.round(st.ivl*1.2));st.ease=Math.max(1.3,st.ease-.15)}
  if(r===2){st.ivl=st.reps===0?1:st.reps===1?3:Math.max(st.ivl+1,Math.round(st.ivl*st.ease))}
  if(r===3){st.ivl=st.reps===0?4:Math.max(st.ivl+2,Math.round(Math.max(st.ivl,1)*st.ease*1.3));st.ease+=.15}
  st.reps++;st.due=now+st.ivl*DAY;return st;
}
const ivlLabel=st=>st.ivl===0?"1분":st.ivl<30?`${st.ivl}일`:`${Math.round(st.ivl/30)}개월`;
function renderDeck(ch){
  const body=$("chBody");let reviewed=0;
  const ids=ch.cards.map((c,i)=>ch.id+":"+i);
  const fresh=()=>ids.filter(id=>!srs[id]);
  const rnd=ch.tag==="Anki",pick=()=>(rnd?shuffle(fresh()):fresh()).slice(0,NEW_PER);
  function build(){const now=Date.now();const due=ids.filter(id=>srs[id]&&srs[id].due<=now).sort((a,b)=>srs[a].due-srs[b].due);return rnd?shuffle(due.concat(pick())):due.concat(pick())}
  let queue=build();
  function counts(){const nNew=queue.filter(id=>!srs[id]).length,nRev=queue.length-nNew,learned=ids.filter(id=>srs[id]&&srs[id].reps>0).length;
    return `<div class="counts">${rnd?`<span>랜덤 순서</span>`:""}<span>새 카드 <b>${nNew}</b></span><span>복습 <b>${nRev}</b></span><span>외운 카드 <b>${learned}/${ids.length}</b></span></div>`}
  $("romTg").hidden=true;
  function draw(rev){
    if(!queue.length)return done();

    body.innerHTML=counts()+dvBar(v)+`<div class="fc" id="fc"><div class="fc-word">${deckFront(w,v)}</div><div class="hint" id="hint">${deckHint(v)}</div></div><button class="btn wide" id="reveal">정답 보기</button>`;
    bindDv(()=>draw(!$("hint")));
    $("reveal").onclick=()=>{
      const st=srs[id];$("hint").remove();
      revealFront(w);$("fc").insertAdjacentHTML("beforeend",deckBack(w,m,ex,ko,note,v)+backBar(id));bindBackBar(id,w,`${plain(w)} · ${ch.title}`);
      if(!ex)showExample(queue.slice(0,12).map(q=>ch.cards[+q.split(":")[1]]).filter(c=>!c[2]).map(c=>[c[0],c[1]]));
      const labels=["다시","어려움","좋음","쉬움"];
      $("reveal").outerHTML=`<div class="rate">${labels.map((l,r)=>`<button class="r${r}" data-r="${r}">${l}<small>${ivlLabel(schedule(st,r))}</small></button>`).join("")}</div><p class="note">숫자는 이 카드를 다시 보게 될 때까지의 간격이에요. ‘다시’를 누른 카드는 오답 노트에도 모여요.</p>`;
      body.querySelector(".rate").onclick=e=>{const b=e.target.closest("button");if(!b)return;const r=+b.dataset.r;
        srs[id]=schedule(srs[id],r);store.set("srs",srs);queue.shift();reviewed++;
        if(r===0){queue.splice(Math.min(3,queue.length),0,id);wrong.c[id]=(wrong.c[id]||0)+1;saveWrong()}

    };

  function done(){

    body.innerHTML=counts()+`<div class="card"><div class="result">${reviewed?"오늘 분량 완료":"복습할 카드가 없어요"}</div><p class="sub" style="margin:0">${reviewed?`이번에 ${reviewed}장을 학습했어요. `:""}${tom?`24시간 안에 ${tom}장이 다시 복습 대기열에 올라와요.`:"다음 복습 일정이 되면 이 챕터에 표시돼요."}</p>
      ${left?`<button class="btn wide" id="more">새 카드 ${Math.min(NEW_PER,left)}장 더 학습</button>`:`<p class="sub" style="margin:0">이 챕터의 모든 카드를 한 번씩 학습했어요.</p>`}</div>`;
    if(left)$("more").onclick=()=>{queue=pick();draw()};
  }
  draw();
}

/* ---------- generic quiz runner ---------- */
function runQuiz(items,opt){
  const body=opt.el||$("chBody"),list=opt.noShuffle?items:shuffle(items),t0=Date.now(),x0=xp,L0=lvOf(xp);if(!opt.noLog)quizActive=true;let i=0,score=0;const wr=[];
  function draw(){
    const q=list[i],opts=shuffle(q.c.map((t,k)=>({t,ok:k===0}))),long=q.c.some(t=>textOf(t).length>12);
    body.innerHTML=`<div class="progress"><span class="label" style="font-variant-numeric:tabular-nums">${i+1} / ${list.length}</span><div class="bar"><i style="width:${i/list.length*100}%"></i></div></div>
      ${opt.showSrc&&q.src?`<span class="label">${q.src}</span>`:""}
      <div class="card"><div class="qtext">${R(opt.noRom?q.q:romQ(q.q))}</div><div class="choices${long?" col":""}" id="opts"></div>${opt.unsure?`<button class="linkbtn" id="unsure">잘 모르겠어요</button>`:""}<div class="feedback" id="fb"></div><p class="exp" id="exp" hidden></p>${opt.ask?`<button class="linkbtn" id="askQ" hidden>${IC.ask}이 문제 선배에게 질문</button>`:""}<button class="btn wide" id="nextQ" hidden>${i+1<list.length?"다음 문제":"결과 보기"}</button></div>`;
    const finish=(ok,btn)=>{
      [...$("opts").children].forEach((x,k)=>{x.disabled=true;if(opt.explain!==false&&opts[k].ok)x.classList.add("ok")});
      if(opt.unsure)$("unsure").remove();
      if(ok)score++;else wr.push(q);
      opt.onAnswer&&opt.onAnswer(q,ok);if(!opt.noLog)markStudy("quiz",ok);
      if(opt.explain===false){next();return}
      if(btn&&!ok)btn.classList.add("no");
      $("fb").textContent=ok?"정답이에요!":"아쉬워요";$("fb").className="feedback "+(ok?"ok":"no");
      $("exp").textContent=q.e;$("exp").hidden=false;$("nextQ").hidden=false;

    };
    opts.forEach(o=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`${opt.noRom?"":romLine(o.t)}<span class="jp">${R(o.t)}</span>`;b.onclick=()=>finish(o.ok,b);$("opts").appendChild(b)});
    if(opt.unsure)$("unsure").onclick=()=>finish(false,null);
    $("nextQ").onclick=next;
  }
  function next(){i++;if(i<list.length)return draw();
    if(opt.noLog)return opt.onDone(score,wr,list.length);
    const sk=bumpStreak(),n=list.length,sec=Math.max(1,Math.round((Date.now()-t0)/1000)),L=lvOf(xp),a=xpFor(L),b=xpFor(L+1),left=Math.max(1,Math.round((b-xp)/(b-a)*100));
    opt.onDone(score,wr,n);
    const FL='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c.6 3.2-1.2 5-2.6 6.6C8 10.2 7 11.6 7 14a5 5 0 0 0 10 0c0-2-.8-3.6-1.9-4.9.1 1.5-.5 2.7-1.6 3.3.3-3.4-.6-7.3-1.5-10.4z"/></svg>';
    const html=`${sk.first?`<div class="streakup">${FL}<span>연속 학습</span>${sk.before?`<span class="snum old">${sk.before}일</span><span aria-hidden="true">→</span>`:""}<span class="snum new">${sk.n}일</span>${sk.before?"":`<span style="font-weight:500">시작!</span>`}</div>`:`<p class="sub qxp">오늘 연속 학습 기록은 이미 채웠어요 · 연속 ${sk.n}일</p>`}
      <div class="qstats"><div><b>${Math.round(score/n*100)}%</b><span>정답률</span></div><div><b>${sec<60?`${sec}초`:`${Math.floor(sec/60)}분 ${sec%60}초`}</b><span>걸린 시간</span></div><div><b>${left}%</b><span>다음 레벨까지 남음</span></div></div>
      ${rankOf(L)!==rankOf(L0)?`<div class="rkup rk-${rankOf(L).id}">${emblem(rankOf(L),30)}<span><b>${rankOf(L).name} 티어 승급!</b> ${rankOf(L0).name} → ${rankOf(L).name}</span></div>`:""}<p class="sub qxp">이번 퀴즈 +${xp-x0} XP${L>L0?` · 레벨 업! Lv.${L0} → Lv.${L}`:""} · Lv.${L+1}까지 ${b-xp} XP</p>`;
    const r=body.querySelector(".result");if(r&&r.insertAdjacentHTML)r.insertAdjacentHTML("afterend",html);

function clean(f){
  let x=String(f).replace(/<(script|style|button|object)[\s\S]*?<\/\1>/gi," ").replace(/\[sound:[^\]]*\]/g,"").replace(/<br\s*\/?>/gi," ").replace(/<\/(div|p|li)>/gi," ").replace(/<[^>]+>/g,"");

  return esc(x);
}
const furi=x=>x.replace(/\s?([㐀-鿿豈-﫿々〆ヶ]+)\[([^\][]+)\]/g,"{$1|$2}");
function splitDelim(t,sep){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];

    else if(c==='"'&&f==="")q=true;
    else if(c===sep){row.push(f);f=""}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}
    else if(c!=="\r")f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
function parseAnki(text){
  text=text.replace(/^﻿/,"");let sep=null,names=null,deckName="";const meta=[],lines=text.split(/\r?\n/);let i=0;
  for(;i<lines.length;i++){const ln=lines[i];if(!ln.startsWith("#"))break;const m=ln.match(/^#([^:]+):(.*)$/);if(!m)continue;const k=m[1].trim().toLowerCase(),v=m[2].trim();
    if(k==="separator")sep={tab:"\t",comma:",",semicolon:";",space:" ",pipe:"|",colon:":"}[v.toLowerCase()]||v[0];
    else if(k==="columns")names=v;else if(k==="deck")deckName=v;
    else if(/(guid|notetype|deck|tags) column/.test(k))meta.push(+v-1)}
  const sample=lines.slice(i,i+30).join("\n");
  if(!sep)sep=sample.includes("\t")?"\t":(sample.split(";").length>sample.split(",").length?";":",");
  let rows=splitDelim(lines.slice(i).join("\n"),sep).filter(r=>r.some(c=>c.trim()));
  if(names)names=splitDelim(names,sep)[0]||null;
  if(meta.length){rows=rows.map(r=>r.filter((_,k)=>!meta.includes(k)));if(names)names=names.filter((_,k)=>!meta.includes(k))}
  let rich=false;
  if(rows.some(r=>/class="(jp|kana|card|meaning|jp_pattern)"/.test(r.join("")))){
    rich=true;const cls=(h,c)=>{const m=h.match(new RegExp('class="'+c+'"[^>]*>([\\s\\S]*?)</div>'));return m?m[1]:""};
    names=["단어·문장","읽기","뜻","패턴·묶음","종류"];
    rows=rows.map(r=>{const h=r.join("\n"),p=cls(h,"jp_pattern"),th=cls(h,"kanji-theme");return [cls(h,"jp"),cls(h,"kana"),cls(h,"card")||cls(h,"meaning"),p||th,p?"패턴 문장":/class="kana"/.test(h)?"단어":/class="meaning"/.test(h)?"한자":"기타"]});

}
function ankiText(cards){
  const f=x=>unesc(String(x||"")).replace(/[\t\r\n]+/g," "),toA=t=>String(t||"").replace(/\{([^|}]+)\|([^|}]+)(?:\|N[1-5])?\}/g,(m,b,r)=>` ${b}[${r}]`).trim();
  return "#separator:tab\n#html:false\n#columns:Front\tBack\tReading\tExample\tExampleKO\n"+cards.map(([w,m,ex,ko])=>[toA(w),m,reading(w),toA(ex),ko].map(f).join("\t")).join("\n");
}

/* ---------- tutor Q&A ---------- */
const tutorOf=id=>TUTORS.find(t=>t.id===id);
const isOpen=q=>q.status==="wait"||q.status==="assigned";
const tutorAvailable=()=>{const h=new Date().getHours();return h>=HOURS[0]&&h<HOURS[1]};
const load=id=>Qs.filter(q=>q.tutor===id&&q.status==="assigned").length;
function assign(q,exclude,force){
  if(!force&&!tutorAvailable()&&!q.sim)return false;
  const pool=TUTORS.filter(t=>t.id!==exclude);if(!pool.length)return false;
  const ranked=pool.slice().sort((a,b)=>(b.spec.includes(q.type)-a.spec.includes(q.type))||(load(a.id)-load(b.id)));
  q.tutor=ranked[0].id;q.status="assigned";q.assignedAt=Date.now();q.late=false;return true;
}
function statusOf(q){
  if(q.status==="wait")return q.live&&Date.now()-q.created>LIVE_SLA?{cls:"st-late",label:"지연",late:true}:{cls:"st-wait",label:"접수"};
  if(q.status==="assigned")return Date.now()-(q.live?q.created:q.assignedAt)>(q.live?LIVE_SLA:SLA)?{cls:"st-late",label:"지연",late:true}:{cls:"st-assigned",label:"답변 작성 중"};
  if(q.status==="done")return {cls:"st-done",label:"답변 완료"};
  return {cls:"st-cancel",label:"취소됨"};
}
function fmtDur(ms){const s=ms/1000;return s<60?`${Math.max(1,Math.round(s))}초`:s<3600?`${Math.round(s/60)}분`:s<86400?`${(s/3600).toFixed(1)}시간`:`${Math.round(s/86400)}일`}
function fmtTime(t){const d=new Date(t),n=new Date(),hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");return dstr(d)===dstr(n)?hm:`${d.getMonth()+1}/${d.getDate()} ${hm}`}
function autoAnswer(q){
  if(q.ref){const [cid,k]=q.ref.key.split(":"),f=findCh(cid);
    if(f&&q.ref.kind==="card"){const c=f.ch.cards[+k];if(c){const [w,m,ex,ko,note]=c,kj=[...new Set([...plain(w)])].filter(x=>KJ[x]).map(x=>`${x}(${KJ[x][0]})`).join(", ");
      return `‘${plain(w)}’는 ${reading(w)}로 읽고, 뜻은 ‘${m}’예요.${kj?` 한자로는 ${kj}로 이루어져 있어요.`:""}${note?` ${note}`:""} 예문 「${plain(ex)}」(${ko})처럼 써요.`}}
    if(f&&q.ref.kind==="quiz"){const it=f.ch.quiz[+k];if(it)return `정답은 ‘${textOf(it.c[0])}’예요. ${it.e} 같은 표현으로 예문을 하나 직접 만들어 보면 오래 기억에 남아요.`}}
  return "질문 고마워요. 실제 서비스에서는 배정된 선배가 질문을 읽고 직접 답변을 작성해요. 지금 보이는 답변은 데모용 자동 응답이에요.";
}
function tick(){try{settleQs()}catch(e){}
  let changed=false,arrived=false;const now=Date.now();
  Qs.forEach(q=>{if(q.example||q.live)return;
    if(q.status==="wait"&&assign(q))changed=true;
    if(q.status==="assigned"&&q.sim&&now-q.assignedAt>=AUTO){q.answer=autoAnswer(q);q.answeredAt=now;q.status="done";q.seen=false;q.auto=true;changed=arrived=true}
    if(q.status==="assigned"&&!q.late&&now-q.assignedAt>SLA){q.late=true;changed=true}
  });
  if(!changed)return;saveQs();
  if(view==="home")renderHome();else if(view==="menu")renderMenu();else if(view==="inbox"&&inboxTab==="mine")drawInbox();
  if(arrived&&view!=="inbox")toast("선배 답변이 도착했어요. 질문함에서 확인해 보세요.");
}
setInterval(tick,2000);

    F.setDoc(F.doc(db,"tx",u.uid.slice(0,10)+"-"+e.id),{uid:u.uid,email:u.email||"",name:u.displayName||(u.email||"").split("@")[0],type,amt,bal:cash,memo,won:e.won||0,method:e.method||"",ref:e.ref||"",at:e.t}).catch(()=>{})}

/* refunds and late-answer compensation run on this device, so they work even before the console sees them */
function settleQs(){
  let ch=false;
  Qs.forEach(q=>{if(q.example||q.settled||!q.cashv)return;
    const sla=q.fast?(q.live?FAST_SLA:SLA/2):(q.live?LIVE_SLA:SLA),end=q.status==="done"?q.answeredAt:q.status==="cancel"?null:Date.now();
    if(q.status==="cancel"){if(q.paid&&!q.refunded){q.refunded=true;cashMove("refund",q.paid,"질문 취소 환불",{ref:q.id});qaUpdate(q,{refunded:true});ch=true}return}
    if(end&&end-q.created>sla){
      q.settled=true;ch=true;
      if(q.fast){cashMove("refund",q.paid||0,"빠른 답변 지연 환불",{ref:q.id});cashMove("comp",FAST_COMP,"빠른 답변 지연 보상",{ref:q.id});toast(`빠른 답변이 늦어 ${won((q.paid||0)+FAST_COMP)}캐시를 돌려드렸어요.`)}
      else{cashMove("comp",LATE_COMP,"답변 지연 보상",{ref:q.id});toast(`답변이 2시간을 넘겨 ${LATE_COMP}캐시를 보상했어요.`)}
      qaUpdate(q,{compensated:true});
    }
  });
  if(ch)saveQs();
}
/* compensation the console grants (comp collection) */
function compSubscribe(){
  if(acct.compUnsub||!liveQA())return;const {F,db}=acct.fb,uid=acct.user.uid;
  try{acct.compUnsub=F.onSnapshot(F.query(F.collection(db,"comp"),F.where("uid","==",uid)),s=>{
    s.docs.forEach(d=>{const r=d.data()||{};if(r.claimed)return;
      F.updateDoc(F.doc(db,"comp",d.id),{claimed:true,claimedAt:Date.now()}).then(()=>{
        cashMove(r.kind==="refund"?"refund":"comp",r.amt||0,`${r.kind==="refund"?"운영진 환불":"운영진 보상"}${r.reason?" · "+r.reason:""}`,{ref:d.id});
        toast(`운영진이 ${won(r.amt||0)}캐시를 지급했어요${r.reason?" ("+r.reason+")":""}.`)}).catch(()=>{})});
  },()=>{acct.compUnsub=null})}catch(e){}
}

const lvLine=x=>{const L=lvOf(x||0);return `Lv.${L} · ${rankOf(L).name} · ${LEVELS[tierOf(L)].name} 단계`};

async function fbLoad(){
  if(acct.fb)return acct.fb;
  const B=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [A,U,F]=await Promise.all(["app","auth","firestore"].map(n=>import(B+`firebase-${n}.js`)));
  const app=A.initializeApp(FIREBASE_CONFIG),auth=U.getAuth(app);try{auth.languageCode="ko"}catch(e){}
  return acct.fb={U,F,auth,db:F.getFirestore(app)};
}
async function acctInit(){
  drawAcct();
  if(!acct.on)return;
  acct.state="loading";acct.err="";drawAcct();
  try{
    const {U,auth}=await fbLoad();
    acctLoadCfg();countVisit();
    U.getRedirectResult(auth).catch(e=>{acct.err=authMsg(e);drawAcct()});
    U.onAuthStateChanged(auth,u=>{
      const prev=acct.user&&acct.user.uid;acct.user=u||null;acct.state=u?"in":"out";
      if(!u){acct.synced=false;acct.merge=null}else if(prev!==u.uid){acct.synced=false;acctSync()}
      drawAcct();
    });
  }catch(e){acct.state="error";acct.err="로그인 서비스를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.";drawAcct()}
}
addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")acctPush()});
addEventListener("pagehide",()=>acctPush());

/* visit counter: page views every load, a visit once per browser session, a new visitor once per device */
function countVisit(){
  try{const {F,db}=acct.fb,d=new Date(),key=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    let v=0,nu=0;try{if(!sessionStorage.getItem(ACCT_PFX+"sess")){sessionStorage.setItem(ACCT_PFX+"sess","1");v=1}}catch(e){}
    if(!ameta.get("seen",false)){ameta.set("seen",true);nu=1}
    F.setDoc(F.doc(db,"visits",key),{day:key,pv:F.increment(1),v:F.increment(v),nu:F.increment(nu)},{merge:true}).catch(()=>{});
  }catch(e){}
}
async function acctLoadCfg(){
  try{const {F,db}=acct.fb,s=await F.getDoc(F.doc(db,"config","app")),c=s.exists()?s.data():{};
    ameta.set("cfg",c);appCfg=c;if(view==="home"&&!$("home").hidden)renderHome()}catch(e){}
}
/* live Q&A: a logged-in learner's questions live in Firestore "questions"; the admin page answers them */
function qaSubscribe(){
  if(acct.qaUnsub||!liveQA())return;const {F,db}=acct.fb;
  try{acct.qaUnsub=F.onSnapshot(F.query(F.collection(db,"questions"),F.where("uid","==",acct.user.uid)),s=>mergeLive(s.docs),()=>{acct.qaUnsub=null})}catch(e){}
}
function mergeLive(docs){
  let changed=false,arrived=0;
  docs.forEach(d=>{const r=d.data()||{};let q=Qs.find(x=>x.id===d.id);
    if(!q){q={id:d.id,created:r.created||Date.now(),type:r.type||"기타",level:r.level||level,text:r.text||"",ref:r.ref||null,live:true,sim:false,seen:r.status==="done",reassigned:0,paid:r.paid||0,fast:!!r.fast,cashv:r.cashv||0,settled:!!r.compensated,refunded:!!r.refunded};Qs.push(q);changed=true}
    const was=q.status;
    ["status","tutor","assignedAt","answer","answeredAt","rating","reassigned","reassignReq","cancelReason"].forEach(k=>{if(r[k]!==undefined&&JSON.stringify(q[k])!==JSON.stringify(r[k])){q[k]=r[k];changed=true}});
    if(q.status==="done"&&was&&was!=="done"){q.seen=false;q.auto=false;arrived++}
  });
  if(!changed)return;Qs.sort((a,b)=>b.created-a.created);saveQs();
  if(view==="home")renderHome();else if(view==="menu")renderMenu();else if(view==="inbox"&&inboxTab==="mine")drawInbox();
  if(arrived&&view!=="inbox")toast("선배 답변이 도착했어요. 질문함에서 확인해 보세요.");
}
function qaUpdate(q,patch){
  if(!q.live||!liveQA())return;const {F,db}=acct.fb;
  F.updateDoc(F.doc(db,"questions",q.id),patch).catch(()=>toast("변경 내용을 보내지 못했어요. 인터넷 연결을 확인해 주세요."));
}

/* first sync after login: decide whether the device or the account copy wins */
async function acctSync(){
  const u=acct.user;if(!u||!acct.fb)return;const {F,db}=acct.fb;
  acct.busy=true;acct.err="";drawAcct();
  try{
    const snap=await F.getDoc(F.doc(db,"users",u.uid)),cloud=snap.exists()?snap.data():null;
    const owner=ameta.get("owner",null),lx=store.get("xp",0),localHas=lx>0||store.get("onboarded",false),dirty=ameta.get("dirty",false);
    acct.busy=false;
    if(cloud&&cloud.data&&Object.keys(cloud.data).length){
      if(owner===u.uid){
        /* same account on this device: newer account copy wins unless this device has unsaved, further-ahead progress */
        /* an edit from the admin page (level change, reset) always wins */
        const forced=!!(cloud.adminEdit&&(cloud.adminEdit.at||0)>ameta.get("syncedAt",0));
        if((cloud.updatedAt||0)>ameta.get("syncedAt",0)&&(forced||!(dirty&&lx>(cloud.xp||0)))){
          if(forced)try{sessionStorage.setItem(ACCT_PFX+"note","운영진이 학습 기록을 조정했어요.")}catch(e){}
          return acctApply(cloud,u.uid)}
      }else if(!owner&&localHas){acct.merge={cloud,lx};drawAcct();openAcct();return}
      else return acctApply(cloud,u.uid);
    }
    ameta.set("owner",u.uid);acct.synced=true;qaSubscribe();compSubscribe();earnOnce("welcome",EARN.welcome,"첫 로그인 보너스");
    if(dirty||!cloud||!cloud.data)await acctPush(true);
  }catch(e){acct.busy=false;acct.err=fsMsg(e)}
  drawAcct();
}
function acctApply(cloud,uid){
  const at=cloud.updatedAt||Date.now();applySnapshot(cloud.data||{});ameta.set("owner",uid);ameta.set("syncedAt",at);ameta.set("dirty",false);
  /* if this browser can't store the copy (private mode, full storage) a reload would just loop, so stop here */
  if(ameta.get("syncedAt",0)!==at){acct.err="이 브라우저에 기록을 저장할 수 없어요. 비공개 모드를 끄거나 저장 공간을 확인해 주세요.";drawAcct();return}
  acct.msg="계정 기록을 불러왔어요.";try{const nt=sessionStorage.getItem(ACCT_PFX+"note");sessionStorage.removeItem(ACCT_PFX+"note");sessionStorage.setItem(ACCT_PFX+"toast",nt?`${nt} 지금은 ${lvLine(JSON.parse((cloud.data||{}).xp||"0"))}예요.`:`${lvLine(JSON.parse((cloud.data||{}).xp||"0"))} 기록을 불러왔어요.`)}catch(e){}
  acctReload();
}
function acctReload(){location.reload()}
async function acctPush(force){
  clearTimeout(acct.t);acct.t=null;
  if(!acct.user||!acct.synced||!acct.fb)return;
  if(acct.pushing){acct.again=true;return}
  if(!force&&!ameta.get("dirty",false))return;
  const v=acct.ver,u=acct.user,{F,db}=acct.fb,data=progressSnapshot(),now=Date.now(),x=store.get("xp",0);
  acct.pushing=true;
  try{
    if(JSON.stringify(data).length>950000)throw {code:"too-big"};
    await F.setDoc(F.doc(db,"users",u.uid),{v:1,updatedAt:now,xp:x,lv:lvOf(x),name:u.displayName||"",email:u.email||"",data});
    ameta.set("syncedAt",now);acct.lastSave=now;acct.err="";
    if(acct.ver===v)ameta.set("dirty",false);else acct.again=true;
  }catch(e){acct.err=fsMsg(e)}
  acct.pushing=false;
  if(acct.again){acct.again=false;acct.t=setTimeout(()=>acctPush(),2500)}
  drawAcct();
}
async function acctGoogle(){
  const {U,auth}=acct.fb,p=new U.GoogleAuthProvider();acct.err="";acct.msg="";acct.busy=true;drawAcct();
  try{await U.signInWithPopup(auth,p)}
  catch(e){
    if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){try{await U.signInWithRedirect(auth,p);return}catch(e2){e=e2}}
    acct.err=authMsg(e);
  }
  if(!acct.user)acct.busy=false;drawAcct();
}
async function acctEmail(mode){
  const em=($("acEm")||{}).value?$("acEm").value.trim():"",pw=($("acPw")||{}).value||"";acct.em=em;acct.err="";acct.msg="";
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){acct.err="이메일 주소 형식을 확인해 주세요.";return drawAcct()}
  if(mode==="reset"){
    acct.busy=true;drawAcct();
    try{await acct.fb.U.sendPasswordResetEmail(acct.fb.auth,em);acct.msg=`${em}(으)로 비밀번호 재설정 메일을 보냈어요. 메일함을 확인해 주세요.`}catch(e){acct.err=authMsg(e)}
    acct.busy=false;return drawAcct();
  }
  if(pw.length<6){acct.err="비밀번호는 6자 이상이에요.";return drawAcct()}
  acct.busy=true;drawAcct();
  try{const U=acct.fb.U;await (mode==="signup"?U.createUserWithEmailAndPassword:U.signInWithEmailAndPassword)(acct.fb.auth,em,pw)}
  catch(e){acct.err=authMsg(e)}
  if(!acct.user)acct.busy=false;drawAcct();
}
async function acctLogout(){
  acct.busy=true;acct.err="";drawAcct();
  if(acct.synced&&ameta.get("dirty",false))await acctPush(true);
  if(acct.synced&&ameta.get("dirty",false)){acct.busy=false;acct.err="아직 계정에 저장하지 못한 기록이 있어요. 인터넷 연결을 확인한 뒤 다시 로그아웃해 주세요.";return drawAcct()}
  try{await acct.fb.U.signOut(acct.fb.auth)}catch(e){}
  if(acct.synced||ameta.get("owner",null))clearProgress();
  ["owner","syncedAt","dirty"].forEach(k=>ameta.set(k,null));
  try{sessionStorage.setItem(ACCT_PFX+"toast","로그아웃했어요. 다시 로그인하면 기록을 이어서 볼 수 있어요.")}catch(e){}
  acctReload();
}
function acctChoose(which){
  const m=acct.merge,u=acct.user;if(!m||!u)return;acct.merge=null;
  if(which==="cloud")return acctApply(m.cloud,u.uid);
  ameta.set("owner",u.uid);acct.synced=true;qaSubscribe();compSubscribe();acctPush(true);closeSheet();toast("이 기기 기록을 계정에 저장했어요.");
}

/* header button + sheet */
function drawAcct(){
  const b=$("acctBtn");
  if(b){const u=acct.user,s=!acct.on?"off":acct.state==="in"?(acct.err?"err":acct.merge?"warn":acct.synced?"in":"busy"):acct.state;
    b.dataset.s=s;
    b.innerHTML=u?`<span class="av">${avText(u)}</span><span class="acn">${acct.merge?"기록 선택":"내 계정"}</span>`:`<span class="av">${USER_IC}</span><span class="acn">${acct.state==="loading"?"연결 중":"로그인"}</span>`;
    b.setAttribute("aria-label",u?`내 계정 · ${u.email||u.displayName||""}`:"로그인")}
  if($("acSheet"))fillAcct();
}
function openAcct(){
  $("sheetRoot").innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" id="acSheet" role="dialog" aria-modal="true" aria-labelledby="acT"></div></div>`;
  $("sbg").onclick=e=>{if(e.target.id==="sbg")closeSheet()};
  fillAcct();
}
function fillAcct(){
  const el=$("acSheet");if(!el)return;
  const keepEm=$("acEm")?$("acEm").value:acct.em||"",keepPw=$("acPw")?$("acPw").value:"";
  const u=acct.user,dis=acct.busy?" disabled":"",x=store.get("xp",0);
  const msgs=`${acct.err?`<p class="err" role="alert" style="margin:0">${esc(acct.err)}</p>`:""}${acct.msg?`<p class="acok" role="status">${esc(acct.msg)}</p>`:""}`;
  const head=t=>`<div class="ac-top"><h3 id="acT">${t}</h3><button class="ac-x" id="acX" aria-label="닫기">✕</button></div>`;
  let h;
  if(!acct.on){
    h=head("계정")+`<p style="margin:0">로그인 기능이 아직 연결되지 않은 화면이에요. 지금은 학습 기록이 <b>이 브라우저에만</b> 저장돼요.</p>
      <div class="acstat"><span class="label">이 브라우저의 기록</span><b>${lvLine(x)}</b></div>
      <p class="note" style="text-align:left">운영자 안내: 같은 폴더의 <code>firebase-config.js</code>에 Firebase 웹 앱 설정을 적어 올리면 로그인이 켜져요.</p>`;
  }else if(acct.state==="loading"||(acct.state==="in"&&acct.busy&&!acct.synced&&!acct.merge)){
    h=head("계정")+`<p class="acwait"><span class="spin" aria-hidden="true"></span>${acct.state==="loading"?"로그인 서비스를 불러오는 중이에요…":"계정 기록을 확인하는 중이에요…"}</p>${msgs}`;
  }else if(acct.state==="error"){
    h=head("계정")+msgs+`<button class="btn wide" id="acRetry">다시 시도</button><p class="note" style="text-align:left">로그인하지 않아도 이 브라우저에는 기록이 남아요.</p>`;
  }else if(!u){
    h=head("로그인")+`<p class="sub" style="margin:0">로그인하면 레벨, 오답 노트, 내 단어장이 계정에 저장돼요. 휴대폰과 노트북에서 이어서 공부할 수 있어요.</p>
      ${IN_APP?`<p class="acwarn">카카오톡·인스타그램 같은 앱 안의 브라우저에서는 Google 로그인이 막혀요. 오른쪽 위 메뉴에서 ‘다른 브라우저로 열기’를 누르거나 이메일로 로그인해 주세요.</p>`:""}
      <button class="gbtn" id="acG"${dis}><span class="g-ic" aria-hidden="true">G</span>Google 계정으로 계속하기</button>
      <div class="or">또는 이메일</div>
      <div class="field"><label for="acEm">이메일</label><input type="email" id="acEm" autocomplete="email" inputmode="email" placeholder="you@example.com" value="${esc(keepEm)}"${dis}></div>
      <div class="field"><label for="acPw">비밀번호 <span class="sub" style="font-weight:500">6자 이상</span></label><input type="password" id="acPw" autocomplete="current-password" value="${esc(keepPw)}"${dis}></div>
      ${msgs}
      <div style="display:flex;gap:8px"><button class="btn" id="acIn" style="flex:1"${dis}>${acct.busy?"확인 중…":"로그인"}</button><button class="btn ghost" id="acUp" style="flex:1"${dis}>회원가입</button></div>
      <div style="display:flex;gap:14px;flex-wrap:wrap"><button class="linkbtn" id="acRs" style="font-weight:500;color:var(--muted)"${dis}>비밀번호를 잊었어요</button><button class="linkbtn" id="acFind" style="font-weight:500;color:var(--muted)">가입한 이메일을 잊었어요</button></div>
      <p class="note" style="text-align:left">로그인하지 않아도 이 브라우저에는 기록이 남아요. 처음 로그인하면 지금까지의 기록이 계정으로 옮겨져요.</p>`;
  }else if(acct.merge){
    const c=acct.merge.cloud;
    h=head("어떤 기록으로 이어 갈까요?")+`<p class="sub" style="margin:0">이 기기에서 로그인 없이 공부한 기록과 계정에 저장된 기록이 따로 있어요. 하나를 고르면 다른 하나는 지워져요.</p>
      <div class="mchoice">
        <button class="mopt" id="acCloud"${dis}><b>계정 기록 불러오기</b><span>${lvLine(c.xp)}</span><small>마지막 저장 ${fmtAgo(c.updatedAt)}</small></button>
        <button class="mopt" id="acLocal"${dis}><b>이 기기 기록 쓰기</b><span>${lvLine(acct.merge.lx)}</span><small>계정에 있던 기록은 이 기록으로 바뀌어요</small></button>
      </div>${msgs}`;
  }else{
    const dirty=ameta.get("dirty",false),saved=acct.lastSave||ameta.get("syncedAt",0);
    h=head("내 계정")+`<div class="acrow"><span class="av big">${avText(u)}</span><div style="min-width:0"><b class="acname">${esc(u.displayName||u.email||"")}</b>${u.displayName&&u.email?`<span class="sub acmail">${esc(u.email)}</span>`:""}</div></div>
      <div class="acstat"><span class="label">계정에 저장된 학습 기록</span><b>${lvLine(x)}</b><span class="sub">${acct.pushing?"저장하는 중…":dirty?"곧 자동으로 저장돼요":`자동 저장됨 · 마지막 저장 ${fmtAgo(saved)}`}</span></div>
      ${msgs}
      <div style="display:flex;gap:8px"><button class="btn ghost" id="acSave" style="flex:1"${dis}>지금 저장</button><button class="btn ghost" id="acOut" style="flex:1;color:var(--bad)"${dis}>로그아웃</button></div>
      <p class="note" style="text-align:left">퀴즈를 풀거나 카드를 넘기면 몇 초 안에 계정에 자동 저장돼요. 로그아웃하면 이 기기의 기록은 지워지고 계정에 안전하게 남아요.</p>`;
  }
  el.innerHTML=h;
  const on=(id,f)=>{const b=$(id);if(b)b.onclick=f};
  on("acX",closeSheet);on("acRetry",()=>{acct.fb=null;acctInit()});on("acG",acctGoogle);
  on("acIn",()=>acctEmail("login"));on("acFind",()=>openSupport("account"));on("acUp",()=>acctEmail("signup"));on("acRs",()=>acctEmail("reset"));
  on("acCloud",()=>acctChoose("cloud"));on("acLocal",()=>acctChoose("local"));
  on("acSave",async()=>{acct.msg="";await acctPush(true);if(!acct.err){acct.msg="계정에 저장했어요.";fillAcct()}});on("acOut",acctLogout);
  if($("acPw"))$("acPw").onkeydown=e=>{if(e.key==="Enter")acctEmail("login")};
}
$("acctBtn").onclick=()=>{acct.msg="";openAcct()};
$("redoBtn").onclick=replayTutorial;
drawCash();$("cashBtn").onclick=()=>openWallet();
try{const t=sessionStorage.getItem(ACCT_PFX+"toast");if(t){sessionStorage.removeItem(ACCT_PFX+"toast");setTimeout(()=>toast(t),400)}}catch(e){}

if(store.get("onboarded",false)){$("home").hidden=false;renderHome()}else showOnboard("goal");
acctInit();
</script>
